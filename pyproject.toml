[project]
name = "photovault"
version = "0.1.0"
description = "Verified photo ingest and multi-drive vault catalog: the engine behind a macOS menu-bar app"
requires-python = ">=3.12"
# Approved runtime dependencies are listed in docs/steering/vault-rules.md. Add one only in the task
# that approves it (fnd-5 adds PyExifTool, seq-3 adds Pillow).
dependencies = [
    "pillow>=13.0.0",
    "pyexiftool>=0.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "photovault"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realfiles: needs local sample photos under testdata/corpus (gitignored); skipped when absent",
    "live: reads real mounted drives, read-only; runs only with `-m live` and a registry (live-1)",
]
